# Pedagogical fragment for filled-header + measure-column shards.
# Not an input to a generator. Copy the shape into sidecar YAML.
#
# Layout this models (year on triplet start; Gap is the public measure):
#
#   row 1:  2050   (blank) (blank)  2075
#   row 2:  Base   Alt     Gap      Base   Alt     Gap
#   rows:   ...    ...     H3:H5    ...    ...     K3:K5
#
# Anti-pattern: one series covering H3:K5 and column_header without fill —
# only labeled start columns resolve; mixed measures share the same
# (SCENARIO, TIME_PERIOD) key.
#
# Shared vs unique compute names / input series ids across shards:
# - Share the same output.compute.name or input series id when shards are
#   complementary slices of one logical public series (this file: Gap columns
#   for 2050/2075 → one compute_gap_milestones).
# - Uniquify per shard when each shard is a distinct scenario/engine path.
#   Sharing a name/id across those paths merges definitions at export and can
#   leave most scenario paths unreachable in the exported library.
schema_version: 1.19.0
workbook: workbook.xlsx

concept_scheme:
  id: measure_shard_pattern
  concepts:
    - id: OBS_VALUE
      name: Observation value
      dtype: number
    - id: TIME_PERIOD
      name: Time period
      dtype: int
    - id: SCENARIO
      name: Scenario
      dtype: string
    - id: MEASURE
      name: Measure
      dtype: string

outputs:
  series:
    - id: gap_milestones_2050
      sheet: Summary
      data_range: Summary!H3:H5
      layout: series
      output:
        compute:
          name: compute_gap_milestones
          record_contract: records
      structure:
        measure:
          concept: OBS_VALUE
          dtype: float
          bind:
            kind: data_cell
            read: float
        dimensions:
          - id: SCENARIO
            concept: SCENARIO
            role: key
            scope: cell
            bind:
              kind: row_label
              label_column: A
              read: string
          - id: TIME_PERIOD
            concept: TIME_PERIOD
            role: key
            scope: cell
            bind:
              kind: column_header
              header_row: 1
              fill: true
              read: int
      key: [SCENARIO, TIME_PERIOD]
      notes: >
        Gap measure column for the 2050 triplet. Year sits on the triplet start
        column; fill: true propagates TIME_PERIOD onto this Gap column.
        Shares compute_gap_milestones with the 2075 shard intentionally.

    - id: gap_milestones_2075
      sheet: Summary
      data_range: Summary!K3:K5
      layout: series
      output:
        compute:
          name: compute_gap_milestones
          record_contract: records
      structure:
        measure:
          concept: OBS_VALUE
          dtype: float
          bind:
            kind: data_cell
            read: float
        dimensions:
          - id: SCENARIO
            concept: SCENARIO
            role: key
            scope: cell
            bind:
              kind: row_label
              label_column: A
              read: string
          - id: TIME_PERIOD
            concept: TIME_PERIOD
            role: key
            scope: cell
            bind:
              kind: column_header
              header_row: 1
              fill: true
              read: int
      key: [SCENARIO, TIME_PERIOD]
      notes: >
        Gap measure column for the 2075 triplet. Widen extraction targets (and
        any overlapping internals) through column K so these cells are on-graph.
        Shares compute_gap_milestones with the 2050 shard intentionally.

internals:
  series:
    - id: summary_milestone_triplet_block
      sheet: Summary
      data_range: Summary!F3:K5
      layout: matrix
      internal: {}
      structure:
        measure:
          concept: OBS_VALUE
          dtype: float
          bind:
            kind: data_cell
            read: float
        dimensions:
          - id: SCENARIO
            concept: SCENARIO
            role: key
            scope: cell
            bind:
              kind: row_label
              label_column: A
              read: string
          - id: TIME_PERIOD
            concept: TIME_PERIOD
            role: key
            scope: cell
            bind:
              kind: column_header
              header_row: 1
              fill: true
              read: int
          - id: MEASURE
            concept: MEASURE
            role: key
            scope: cell
            bind:
              kind: column_header
              header_row: 2
              read: string
      key: [SCENARIO, TIME_PERIOD, MEASURE]
      notes: >
        Internal triangulation of the full triplet table. MEASURE in the key
        avoids colliding Base/Alt/Gap under the same TIME_PERIOD. Do not let
        this matrix cover cells already owned by public output series.
