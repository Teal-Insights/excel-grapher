name: Refresh Workflow Graph Docs

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  refresh:
    name: Build and commit workflow graph docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Build workflow docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/build_workflow_cytoscape_preset.py

      - name: Check for generated file changes
        id: changes
        run: |
          if git diff --quiet -- docs/workflow.json docs/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated docs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/workflow.json docs/index.html
          git commit -m "Update generated workflow graph docs"
          git push
