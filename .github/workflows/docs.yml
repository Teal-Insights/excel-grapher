name: Docs

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check release workflow CI passed
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
              }
            );
            const ci = jobs.find((job) => job.name === "ci");
            core.setOutput(
              "proceed",
              ci?.conclusion === "success" ? "true" : "false"
            );

  build-and-publish:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install package and dependencies
        run: |
          uv sync
          uv pip install great-docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build docs
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUE_READ_PAT }}
        run: uv run great-docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
