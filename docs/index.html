<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Graph</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }
    #sidebar {
      border-right: 1px solid #8884;
      padding: 12px;
      overflow: auto;
    }
    #cy {
      width: 100%;
      height: 100%;
      display: block;
    }
    input, select, button {
      width: 100%;
      margin: 0.3rem 0;
      padding: 0.45rem;
      box-sizing: border-box;
    }
    .muted {
      opacity: 0.8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h3>Workflow</h3>
    <div id="summary" class="muted">Loading...</div>
    <label for="repoFilter">Repo filter</label>
    <select id="repoFilter">
      <option value="__all__">All repos</option>
    </select>
    <label for="searchBox">Search issues</label>
    <input id="searchBox" type="text" placeholder="issue #, title..." />
    <label for="layoutSelect">Layout</label>
    <select id="layoutSelect">
      <option value="klay" selected>klay (default)</option>
      <option value="fcose">fcose</option>
      <option value="breadthfirst">breadthfirst</option>
    </select>
    <button id="resetView">Reset view</button>
    <p class="muted">Click an issue node to open it in GitHub.</p>
  </aside>
  <main id="cy"></main>

  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <script src="https://unpkg.com/klayjs@0.4.1/klay.js"></script>
  <script src="https://unpkg.com/cytoscape-klay@3.1.4/cytoscape-klay.js"></script>
  <script>
    async function init() {
      cytoscape.use(cytoscapeFcose);
      cytoscape.use(cytoscapeKlay);

      function runLayout(cy, layoutName) {
        if (layoutName === 'klay') {
          cy.layout({
            name: 'klay',
            klay: {
              direction: 'DOWN',
              edgeRouting: 'ORTHOGONAL',
              spacing: 36,
              inLayerSpacingFactor: 1.8,
              nodeLayering: 'NETWORK_SIMPLEX',
              thoroughness: 7
            },
            fit: true,
            padding: 32,
            animate: false
          }).run();
          return;
        }

        if (layoutName === 'fcose') {
          cy.layout({
            name: 'fcose',
            quality: 'proof',
            randomize: false,
            animate: false,
            packComponents: true,
            nodeRepulsion: 9000,
            idealEdgeLength: 120,
            edgeElasticity: 0.08,
            nestingFactor: 0.9,
            gravity: 0.25,
            gravityCompound: 1.0,
            numIter: 1800
          }).run();
          return;
        }

        cy.layout({
          name: 'breadthfirst',
          directed: true,
          spacingFactor: 1.2,
          animate: false,
          padding: 30
        }).run();
      }

      const res = await fetch("workflow.json");
      if (!res.ok) {
        throw new Error(`Failed to load workflow.json: ${res.status}`);
      }
      const graph = await res.json();
      const nodes = graph.elements.nodes || [];
      const edges = graph.elements.edges || [];

      const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [...nodes, ...edges],
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'font-size': 11,
              'text-wrap': 'wrap',
              'text-max-width': 220,
              'background-color': '#8DA0CB',
              'text-valign': 'center',
              'text-halign': 'center',
              'shape': 'round-rectangle',
              'padding': '8px',
            }
          },
          {
            selector: 'node[type = "repo"]',
            style: {
              'label': 'data(label)',
              'background-opacity': 0.08,
              'border-width': 2,
              'border-style': 'solid',
              'border-color': '#555',
              'font-size': 14,
              'font-weight': 700,
              'text-valign': 'top',
              'text-halign': 'center',
              'text-wrap': 'wrap',
              'text-max-width': 260,
              'text-margin-y': -8,
              'padding': '18px',
            }
          },
          {
            selector: 'node[type = "pre_group"], node[type = "post_group"]',
            style: {
              'label': 'data(label)',
              'background-opacity': 0.06,
              'border-width': 1,
              'border-style': 'dashed',
              'border-color': '#666',
              'font-size': 12,
              'font-weight': 600,
              'text-valign': 'top',
              'text-halign': 'center',
              'text-wrap': 'wrap',
              'text-max-width': 240,
              'text-margin-y': -6,
              'padding': '14px',
            }
          },
          {
            selector: 'node[type = "issue"]',
            style: {
              'background-opacity': 1,
              'background-color': '#6DA6FF',
              'font-size': 10,
              'text-wrap': 'wrap',
              'text-max-width': 220,
              'width': 'label',
              'height': 'label',
              'padding': '12px',
            }
          },
          {
            selector: 'edge',
            style: {
              'curve-style': 'bezier',
              'target-arrow-shape': 'triangle',
              'width': 1.6,
              'line-color': '#666',
              'target-arrow-color': '#666',
              'label': 'data(label)',
              'font-size': 9,
              'text-background-opacity': 1,
              'text-background-color': '#fff',
              'text-background-padding': 1,
            }
          },
          {
            selector: '.hidden',
            style: {
              'display': 'none'
            }
          }
        ]
      });

      runLayout(cy, 'klay');

      const summary = document.getElementById('summary');
      summary.textContent = `${graph.meta.issue_count} issues · ${graph.meta.edge_count} blocks edges`;

      const repoFilter = document.getElementById('repoFilter');
      const layoutSelect = document.getElementById('layoutSelect');
      for (const repo of graph.meta.repos || []) {
        const option = document.createElement('option');
        option.value = repo;
        option.textContent = repo;
        repoFilter.appendChild(option);
      }

      const applyFilters = () => {
        const selectedRepo = repoFilter.value;
        const query = document.getElementById('searchBox').value.trim().toLowerCase();

        cy.elements().removeClass('hidden');

        if (selectedRepo !== '__all__') {
          cy.nodes().forEach((node) => {
            const repo = node.data('repo');
            if (repo && repo !== selectedRepo) {
              node.addClass('hidden');
            }
          });
        }

        if (query) {
          cy.nodes('[type = "issue"]').forEach((node) => {
            const hay = `${node.data('number')} ${node.data('title')}`.toLowerCase();
            if (!hay.includes(query)) {
              node.addClass('hidden');
            }
          });
        }

        cy.edges().forEach((edge) => {
          if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
            edge.addClass('hidden');
          }
        });
      };

      repoFilter.addEventListener('change', applyFilters);
      document.getElementById('searchBox').addEventListener('input', applyFilters);
      layoutSelect.addEventListener('change', () => runLayout(cy, layoutSelect.value));
      document.getElementById('resetView').addEventListener('click', () => {
        repoFilter.value = '__all__';
        layoutSelect.value = 'klay';
        document.getElementById('searchBox').value = '';
        cy.elements().removeClass('hidden');
        runLayout(cy, layoutSelect.value);
      });

      cy.on('tap', 'node[type = "issue"]', (evt) => {
        const url = evt.target.data('url');
        if (url) {
          window.open(url, '_blank', 'noopener');
        }
      });
    }

    init().catch((error) => {
      document.getElementById('summary').textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
