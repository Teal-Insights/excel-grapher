[project]
name = "excel-grapher"
version = "4.1.1"

description = "Build and analyze dependency graphs from Excel workbooks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Teal Insights", email = "info@tealinsights.com" },
]
keywords = ["excel", "dependency", "graph", "spreadsheet", "formula", "transpiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastpyxl",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
fast = [
    "numpy>=1.24",
]
networkx = [
    "networkx>=3.0",
]
viz = [
    "graphviz>=0.20",
]
all = [
    "numpy>=1.24",
    "networkx>=3.0",
    "graphviz>=0.20",
]

[project.urls]
Homepage = "https://github.com/Teal-Insights/excel-grapher"
Repository = "https://github.com/Teal-Insights/excel-grapher"

[project.scripts]
excel-grapher = "excel_grapher.cli:main"










































[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel_grapher"]

[tool.hatch.build.targets.wheel.force-include]
"excel_grapher/grapher/lightweight_viz_template.html" = "excel_grapher/grapher/lightweight_viz_template.html"
"excel_grapher/series_bindings/series_binding.schema.json" = "excel_grapher/series_bindings/series_binding.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "excel_grapher/",
    "tests/",
    "README.md",
    "LICENSE",
]

# uv's dependency groups for development (separate from optional-dependencies)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "E501",
    # Require Google formatting on existing docstrings; add docs incrementally.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

[[tool.ty.overrides]]
include = [
    "excel_grapher/exporter/export_runtime/math.py",
    "excel_grapher/exporter/export_runtime/text.py",
    "excel_grapher/exporter/export_runtime/logic.py",
    "excel_grapher/exporter/export_runtime/reference.py",
]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-m", "not slow"]
xfail_strict = true
markers = [
    "slow: opt-in tests that are long-running (deselected by default)"
]


[tool.coverage.run]
source = ["excel_grapher"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]


[tool.uv.sources]
fastpyxl = { git = "https://github.com/Promptly-Technologies-LLC/fastpyxl" }


[tool.semantic_release]
assets = []
build_command_env = []
build_command = "uv build"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = false
no_git_verify = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version:nf"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = false









































[dependency-groups]
# Minimal test runner for the default (NumPy-free) install CI job.
# Intentionally excludes pandas/matplotlib/jupyter so NumPy is not pulled transitively.
test-core = [
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.9",
    "xlsxwriter>=3.2.0",
]
dev = [
    "graphviz>=0.21",
    "great-docs>=0.13.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "polars>=1.42.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
    "python-semantic-release>=10.5.3",
    "quarto>=0.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.9",
    "xlsxwriter>=3.2.0",
    "xlwings>=0.34.0",
]

