# Site URL
# --------
# Canonical address of the deployed documentation site.
# Required for subdirectory deployments, skills page install commands,
# .well-known/ discovery, and sitemaps.
site_url: "https://teal-insights.github.io/excel-grapher/"

# User Guide
# ----------
# Auto-discovered from user_guide/ (numeric prefixes stripped for URLs).
# Sidebar sections: set guide-section in each page's frontmatter.

# Custom Sections
# ---------------
# Examples live in examples/ on GitHub (not built into the docs site).
# Link them from README.md instead.

# Site Settings
# -------------
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   toc-title: On this page    # TOC title (default: "On this page")

# Pre-render Hooks
# ----------------
# Run before Quarto render (from the great-docs/ build directory).
# - patch_great_docs_post_render.py: UTF-8 stdout on Windows
# - build_workflow.py: live workflow graph (ISSUE_READ_PAT in CI)
pre_render:
  - scripts/patch_great_docs_post_render.py
  - scripts/build_workflow.py
#
# On Windows, also use UTF-8 for the great-docs CLI itself:
#   uv run python scripts/great_docs_build.py
# or: PYTHONUTF8=1 uv run great-docs build

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3

# CLI Documentation
# -----------------
# cli:
#   enabled: true              # Enable CLI documentation
#   module: my_package.cli     # Module containing Click commands
#   name: cli                  # Name of the Click command object
