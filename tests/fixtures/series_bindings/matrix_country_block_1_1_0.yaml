schema_version: "1.1.0"
workbook: lic_inputs.xlsx
series:
  - id: country_block_primary_balance
    sheet: Inputs
    data_range: Inputs!F3:J8
    layout: matrix
    setter:
      name: set_country_block_primary_balance
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - concept: REF_AREA
          role: key
          scope: cell
          bind:
            kind: row_hierarchy
            label_column: A
            max_depth: 4
        - concept: INDICATOR
          role: key
          scope: cell
          bind:
            kind: row_label
            label_column: A
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 1
            read: int
    key:
      - REF_AREA
      - INDICATOR
      - TIME_PERIOD
    notes: Schema 1.1.0 example; row_hierarchy and matrix resolution are not implemented yet.
