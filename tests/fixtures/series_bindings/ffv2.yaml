        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 1
            read: datetime
      attributes:
        - concept: UNIT_MEASURE
          role: attribute
          value: YARDS
          include_in_record: true
    key:
      - TIME_PERIOD
    series_context:
      INDICATOR: Yards
    sdmx_notes: Receiving yards per game, keyed by game date.

  - id: puka_avg_yards_per_reception
    sheet: Sheet1
    data_range: Sheet1!B6:Q6
    layout: series
    editable: false
    output:
      compute:
        name: compute_puka_avg_yards_per_reception
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 1
            read: datetime
      attributes:
        - concept: UNIT_MEASURE
          role: attribute
          value: YARDS_PER_REC
          include_in_record: true
    key:
      - TIME_PERIOD
    series_context:
      INDICATOR: Avg
    sdmx_notes: Average yards per reception per game, keyed by game date.

  - id: puka_touchdowns
