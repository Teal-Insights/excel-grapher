schema_version: "1.4.0"
workbook: ffv2.xlsx
concept_scheme:
  id: puka_game_log
  concepts:
    - id: TIME_PERIOD
      dtype: datetime
      description: Game date from column headers (row 1).
series:
  - id: puka_receptions
    sheet: Sheet1
    data_range: Sheet1!B3:Q3
    layout: series
    editable: true
    input:
      setter:
        name: set_puka_receptions
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 1
            read: datetime
      attributes:
        - concept: UNIT_MEASURE
          role: attribute
          value: COUNT
          include_in_record: true
    key:
      - TIME_PERIOD
    series_context:
      INDICATOR: Rec
    sdmx_notes: Number of receptions per game, keyed by game date.

  - id: puka_targets
    sheet: Sheet1
    data_range: Sheet1!B4:Q4
    layout: series
    editable: true
    input:
      setter:
        name: set_puka_targets
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 1
            read: datetime
      attributes:
        - concept: UNIT_MEASURE
          role: attribute
          value: COUNT
          include_in_record: true
    key:
      - TIME_PERIOD
    series_context:
      INDICATOR: Targets
    sdmx_notes: Number of targets per game, keyed by game date.

  - id: puka_yards
    sheet: Sheet1
    data_range: Sheet1!B5:Q5
    layout: series
    editable: true
    input:
      setter:
        name: set_puka_yards
    structure:
