schema_version: 1.7.0
workbook: formula_override.xlsx
concept_scheme:
  id: example_model
  concepts:
    - id: TIME_PERIOD
      dtype: int
    - id: INDICATOR
      dtype: string
series:
  - id: engine_primary_balance
    sheet: Engine
    data_range: Engine!B2:D2
    layout: series
    internal: {}
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind: { kind: data_cell, read: float }
      dimensions:
        - concept: TIME_PERIOD
          role: key
          scope: cell
          bind: { kind: column_header, header_row: 1, read: int }
    key: [TIME_PERIOD]
    series_context:
      INDICATOR: Primary balance
    validation:
      intersect_graph_formulas: true
      require_unique_key: true
