schema_version: 1.19.0
workbook: ../tiny-dsa-labelled.xlsx
series:
  - id: country_profile_names
    sheet: Inputs
    data_range: Inputs!A10:A12
    layout: row_series
    constant: {}
    structure:
      measure:
        concept: OBS_VALUE
        dtype: string
        bind:
          kind: data_cell
          read: string
      dimensions:
        - id: COUNTRY
          concept: COUNTRY
          role: key
          scope: cell
          bind:
            kind: row_label
            label_column: A
            read: string
            normalize: strip
      attributes:
        - concept: PARAMETER
          role: attribute
          value: country_profile_name
          include_in_record: false
    key: [COUNTRY]
    series_context:
      PARAMETER: country_profile_name
    notes: MATCH lookup keys in the country profile table. Reader-only; the user-facing selector is country_name.
