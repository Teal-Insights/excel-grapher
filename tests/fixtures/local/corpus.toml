# Manifest for the uncommitted local inverted-tree workbook pool (#656).
# Workbook paths with source = "committed" are relative to tests/fixtures/.
# All other paths are relative to tests/fixtures/local/.

[[entry]]
id = "tiny_dsa"
source = "committed"
workbook = "inverted_tree/tiny_dsa/tiny-dsa.xlsx"
bindings = "inverted_tree/tiny_dsa/bindings"
constraints = "inverted_tree/tiny_dsa/constraints.py"
max_cells = 200

[[entry]]
id = "qcraft"
workbook = "qcraft/qcraft-toolv10.xlsx"
bindings = "qcraft/bindings"
constraints = "qcraft/constraints.py"
max_cells = 20000

[[entry]]
id = "lic_dsf"
workbook = "lic_dsf/lic-dsf.xlsx"
bindings = "lic_dsf/bindings"
constraints = "lic_dsf/constraints.py"
max_cells = 20000
