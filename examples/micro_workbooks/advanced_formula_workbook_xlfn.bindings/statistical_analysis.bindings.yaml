schema_version: 1.4.0
workbook: advanced_formula_workbook_xlfn.xlsx
concept_scheme:
  id: advanced_formula_workbook
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row.
  - id: LINE_ITEM
    dtype: string
    description: Statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label.
  - id: EMP_ID
    dtype: string
    description: Employee identifier from column A.
  - id: SKU
    dtype: string
    description: Product SKU from column A.
  - id: REP_ID
    dtype: string
    description: Sales rep identifier from column A.
  - id: QUARTER
    dtype: string
    description: Fiscal quarter from header row.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label.
  - id: PERIOD
    dtype: string
    description: Month label or period key.
  - id: MONTH
    dtype: string
    description: Calendar month label from column B.
  - id: YEAR
    dtype: int
    description: Calendar year from column C.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label.
  - id: FUNCTION
    dtype: string
    description: Excel function name.
  - id: DEMO
    dtype: string
    description: Formula toolkit demo name.
series:
- id: monthly_revenue
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!D5:''Statistical Analysis''!D28'
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: YEAR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: C
        read: int
  key:
  - MONTH
  - YEAR
  sdmx_notes: Monthly revenue inputs ($M), keyed by month (B) and year (C).
  series_context:
    TABLE: 24-Month Revenue
  input:
    setter:
      name: set_monthly_revenue
- id: mom_growth
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!E6:''Statistical Analysis''!E28'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: YEAR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: C
        read: int
  key:
  - MONTH
  - YEAR
  sdmx_notes: Month-over-month growth (column E, from row 6).
  series_context:
    TABLE: 24-Month Revenue
  output:
    compute:
      name: compute_mom_growth
- id: rolling_average
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!F7:''Statistical Analysis''!F28'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: YEAR
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: C
        read: int
  key:
  - MONTH
  - YEAR
  sdmx_notes: 3-month OFFSET rolling average (column F, from row 7).
  series_context:
    TABLE: 24-Month Revenue
  output:
    compute:
      name: compute_rolling_average
- id: descriptive_statistics
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!I5:''Statistical Analysis''!I15'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: STATISTIC
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: H
        read: string
  key:
  - STATISTIC
  sdmx_notes: Count, mean, std dev, min, max, etc.
  series_context:
    SECTION: Descriptive Statistics
  output:
    compute:
      name: compute_descriptive_statistics
- id: normdist_z_scores
  sheet: Statistical Analysis
