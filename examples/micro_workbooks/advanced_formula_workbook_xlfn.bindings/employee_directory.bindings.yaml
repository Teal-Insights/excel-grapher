schema_version: 1.4.0
workbook: advanced_formula_workbook_xlfn.xlsx
concept_scheme:
  id: advanced_formula_workbook
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row.
  - id: LINE_ITEM
    dtype: string
    description: Statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label.
  - id: EMP_ID
    dtype: string
    description: Employee identifier from column A.
  - id: SKU
    dtype: string
    description: Product SKU from column A.
  - id: REP_ID
    dtype: string
    description: Sales rep identifier from column A.
  - id: QUARTER
    dtype: string
    description: Fiscal quarter from header row.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label.
  - id: PERIOD
    dtype: string
    description: Month label or period key.
  - id: MONTH
    dtype: string
    description: Calendar month label from column B.
  - id: YEAR
    dtype: int
    description: Calendar year from column C.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label.
  - id: FUNCTION
    dtype: string
    description: Excel function name.
  - id: DEMO
    dtype: string
    description: Formula toolkit demo name.
series:
- id: employee_first_name
  sheet: Employee Directory
  data_range: '''Employee Directory''!B5:''Employee Directory''!B24'
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: EMP_ID
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - EMP_ID
  sdmx_notes: First name inputs (column B).
  series_context: &id001
    TABLE: Employee Master
  input:
    setter:
      name: set_employee_first_name
