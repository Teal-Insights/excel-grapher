schema_version: 1.4.0
workbook: financial_model.xlsx
concept_scheme:
  id: financial_model
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption or line-item label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row (2025-2029).
  - id: PROJECTION_YEAR
    dtype: string
    description: Relative year label from DCF header row (Year 1-4).
  - id: LINE_ITEM
    dtype: string
    description: Financial statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label from column A or E.
  - id: PRODUCT_ID
    dtype: string
    description: Product identifier from column A.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label from column H.
  - id: MONTH
    dtype: string
    description: Calendar month label from column A.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label from column E.
series:
- id: product_prices
  sheet: Product Lookup
  data_range: '''Product Lookup''!D5:''Product Lookup''!D12'
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PRODUCT_ID
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PRODUCT_ID
  sdmx_notes: Unit price inputs ('Product Lookup'!D5:D12), keyed by product ID in
    column A.
  series_context:
    TABLE: Product Master
  input:
    setter:
      name: set_product_prices
- id: product_units_sold
  sheet: Product Lookup
  data_range: '''Product Lookup''!E5:''Product Lookup''!E12'
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: int
      bind:
        kind: data_cell
        read: int
    dimensions:
    - concept: PRODUCT_ID
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PRODUCT_ID
  sdmx_notes: Units sold inputs ('Product Lookup'!E5:E12), keyed by product ID in
    column A.
  series_context:
    TABLE: Product Master
  input:
    setter:
      name: set_product_units_sold
- id: product_revenue
  sheet: Product Lookup
  data_range: '''Product Lookup''!F5:''Product Lookup''!F12'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PRODUCT_ID
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PRODUCT_ID
  sdmx_notes: Computed product revenue ('Product Lookup'!F5:F12), keyed by product
    ID in column A.
  series_context:
    TABLE: Product Master
  output:
    compute:
      name: compute_product_revenue
- id: lookup_product_id
  sheet: Product Lookup
  data_range: '''Product Lookup''!I5:''Product Lookup''!I5'
  layout: scalar
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: FIELD
      role: key
      scope: series
      bind:
        kind: constant
        value: Lookup Product ID
  key:
  - FIELD
  sdmx_notes: Lookup product ID input ('Product Lookup'!I5).
  series_context:
    PANEL: Dynamic Lookup
  input:
    setter:
      name: set_lookup_product_id
- id: lookup_results
  sheet: Product Lookup
  data_range: '''Product Lookup''!I6:''Product Lookup''!I11'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: FIELD
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: H
        read: string
  key:
  - FIELD
  sdmx_notes: VLOOKUP/INDEX-MATCH lookup panel results ('Product Lookup'!I6:I11),
    keyed by field label in column H.
  series_context:
    PANEL: Dynamic Lookup
  output:
    compute:
      name: compute_lookup_results
- id: sumproduct_analytics
  sheet: Product Lookup
  data_range: '''Product Lookup''!I14:''Product Lookup''!I19'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: FIELD
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: H
        read: string
  key:
  - FIELD
  sdmx_notes: Category revenue and weighted-average analytics ('Product Lookup'!I14:I19),
    keyed by field label in column H.
  series_context:
    PANEL: SUMPRODUCT Analytics
  output:
    compute:
      name: compute_sumproduct_analytics
