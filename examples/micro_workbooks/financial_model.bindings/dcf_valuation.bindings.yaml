schema_version: 1.4.0
workbook: financial_model.xlsx
concept_scheme:
  id: financial_model
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption or line-item label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row (2025-2029).
  - id: PROJECTION_YEAR
    dtype: string
    description: Relative year label from DCF header row (Year 1-4).
  - id: LINE_ITEM
    dtype: string
    description: Financial statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label from column A or E.
  - id: PRODUCT_ID
    dtype: string
    description: Product identifier from column A.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label from column H.
  - id: MONTH
    dtype: string
    description: Calendar month label from column A.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label from column E.
series:
- id: dcf_revenue
  sheet: DCF Valuation
  data_range: '''DCF Valuation''!B5:''DCF Valuation''!E5'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PROJECTION_YEAR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 4
        read: string
  key:
  - PROJECTION_YEAR
  sdmx_notes: Revenue ($000s) by year ('DCF Valuation'!B5:E5).
  series_context:
    MODEL: Discounted Cash Flow
    LINE_ITEM: Revenue ($000s)
  output:
    compute:
      name: compute_dcf_revenue
