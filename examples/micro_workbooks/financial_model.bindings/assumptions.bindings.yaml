schema_version: 1.4.0
workbook: financial_model.xlsx
concept_scheme:
  id: financial_model
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption or line-item label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row (2025-2029).
  - id: PROJECTION_YEAR
    dtype: string
    description: Relative year label from DCF header row (Year 1-4).
  - id: LINE_ITEM
    dtype: string
    description: Financial statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label from column A or E.
  - id: PRODUCT_ID
    dtype: string
    description: Product identifier from column A.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label from column H.
  - id: MONTH
    dtype: string
    description: Calendar month label from column A.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label from column E.
series:
- id: model_assumptions
  sheet: Assumptions
  data_range: Assumptions!B5:Assumptions!B11
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Editable revenue-model assumption values (Assumptions!B5:B11), keyed
    by parameter name in column A.
  series_context:
    SECTION: Revenue Assumptions
  input:
    setter:
      name: set_model_assumptions
- id: scenario_assumptions
  sheet: Assumptions
  data_range: Assumptions!B14:Assumptions!B17
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Scenario selector and growth-rate inputs (Assumptions!B14:B17), keyed
    by parameter name in column A.
  series_context:
    SECTION: Scenario Selector
  input:
    setter:
      name: set_scenario_assumptions
- id: active_growth_rate
  sheet: Assumptions
  data_range: Assumptions!B18:Assumptions!B18
  layout: scalar
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: series
      bind:
        kind: constant
        value: Active Growth Rate
  key:
  - PARAMETER
  sdmx_notes: CHOOSE-driven active growth rate (Assumptions!B18).
  series_context:
    SECTION: Scenario Selector
  output:
    compute:
      name: compute_active_growth_rate
