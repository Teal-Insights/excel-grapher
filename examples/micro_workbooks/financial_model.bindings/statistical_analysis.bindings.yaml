schema_version: 1.4.0
workbook: financial_model.xlsx
concept_scheme:
  id: financial_model
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption or line-item label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row (2025-2029).
  - id: PROJECTION_YEAR
    dtype: string
    description: Relative year label from DCF header row (Year 1-4).
  - id: LINE_ITEM
    dtype: string
    description: Financial statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label from column A or E.
  - id: PRODUCT_ID
    dtype: string
    description: Product identifier from column A.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label from column H.
  - id: MONTH
    dtype: string
    description: Calendar month label from column A.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label from column E.
series:
- id: monthly_sales
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!B5:''Statistical Analysis''!B16'
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - MONTH
  sdmx_notes: Monthly sales inputs ('Statistical Analysis'!B5:B16), keyed by month
    label in column A.
  series_context:
    TABLE: Monthly Sales Data
  input:
    setter:
      name: set_monthly_sales
- id: descriptive_statistics
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!F5:''Statistical Analysis''!F12'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: STATISTIC
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: E
        read: string
  key:
  - STATISTIC
  sdmx_notes: Mean, std dev, min, max, count, and OFFSET-based averages ('Statistical
    Analysis'!F5:F12), keyed by statistic label in column E.
  series_context:
    TABLE: Descriptive Statistics
  output:
    compute:
      name: compute_descriptive_statistics
- id: normdist_z_scores
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!F16:''Statistical Analysis''!F25'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: E
        read: string
  key:
  - MONTH
  sdmx_notes: Z-scores for each month ('Statistical Analysis'!F16:F25), keyed by sales
    month in column E.
  series_context: &id001
    TABLE: Normal Distribution
  output:
    compute:
      name: compute_normdist_z_scores
- id: normdist_cdf
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!G16:''Statistical Analysis''!G25'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: E
        read: string
  key:
  - MONTH
  sdmx_notes: NORMDIST cumulative probabilities ('Statistical Analysis'!G16:G25),
    keyed by sales month in column E.
  series_context: *id001
  output:
    compute:
      name: compute_normdist_cdf
- id: normdist_above_below
  sheet: Statistical Analysis
  data_range: '''Statistical Analysis''!H16:''Statistical Analysis''!H25'
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: MONTH
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: E
        read: string
  key:
  - MONTH
  sdmx_notes: Above/below mean labels ('Statistical Analysis'!H16:H25), keyed by sales
    month in column E.
  series_context: *id001
  output:
    compute:
      name: compute_normdist_above_below
