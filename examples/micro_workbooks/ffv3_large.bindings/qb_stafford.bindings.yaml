schema_version: 1.4.0
workbook: ffv3_large.xlsx
concept_scheme:
  id: player_game_log
  concepts:
  - id: GAME_WEEK
    dtype: string
    description: Game week label (W1-W18, PO1-PO3) from column A.
  - id: GAME_DATE
    dtype: string
    description: Game date text from column B (vertical matrix key).
  - id: INDICATOR
    dtype: string
    description: Stat column header from row 3 (horizontal matrix key).
  - id: TOTAL_PHASE
    dtype: string
    description: REG SEASON TOTALS or PLAYOFF TOTALS row label from column A.
series:
- id: stafford_game_date
  sheet: QB - Stafford
  data_range: QB - Stafford!B4:QB - Stafford!B24
  layout: series
  editable: true
  input:
    setter:
      name: set_stafford_game_date
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: GAME_WEEK
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - GAME_WEEK
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    INDICATOR: Date
  sdmx_notes: Game date input column (QB - Stafford!B4:B24), keyed by week label in column A. Populates the vertical matrix key column.
- id: stafford_game_result
  sheet: QB - Stafford
  data_range: QB - Stafford!D4:QB - Stafford!D24
  layout: series
  editable: true
  input:
    setter:
      name: set_stafford_game_result
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: GAME_WEEK
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - GAME_WEEK
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    INDICATOR: Result
  sdmx_notes: Win/loss result input column (QB - Stafford!D4:D24), keyed by week label in column A.
- id: stafford_reg_season_stats
  sheet: QB - Stafford
  data_range: QB - Stafford!E4:QB - Stafford!L20
  layout: matrix
  editable: true
  input:
    setter:
      name: set_stafford_reg_season_stats
  structure:
    measure:
      concept: OBS_VALUE
      dtype: int
      bind:
        kind: data_cell
        read: int
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Regular Season
  sdmx_notes: >-
    Regular-season stat matrix (QB - Stafford!E4:L20). Vertical key GAME_DATE
    from column B; horizontal key INDICATOR from row 3 headers (Pass Att … Fumbles Lost).
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: stafford_playoff_stats
  sheet: QB - Stafford
  data_range: QB - Stafford!E22:QB - Stafford!L24
  layout: matrix
  editable: true
  input:
    setter:
      name: set_stafford_playoff_stats
  structure:
    measure:
      concept: OBS_VALUE
      dtype: int
      bind:
        kind: data_cell
        read: int
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Playoffs
  sdmx_notes: >-
    Playoff stat matrix (QB - Stafford!E22:L24). Vertical key GAME_DATE from column B;
    horizontal key INDICATOR from row 3 headers.
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: stafford_reg_fantasy_score
  sheet: QB - Stafford
  data_range: QB - Stafford!M4:QB - Stafford!M20
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_stafford_reg_fantasy_score
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Regular Season
  sdmx_notes: >-
    Regular-season fantasy score matrix (QB - Stafford!M4:M20). Vertical key GAME_DATE
    from column B; horizontal key INDICATOR Fantasy Score from M3.
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: stafford_playoff_fantasy_score
  sheet: QB - Stafford
  data_range: QB - Stafford!M22:QB - Stafford!M24
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_stafford_playoff_fantasy_score
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Playoffs
  sdmx_notes: >-
    Playoff fantasy score matrix (QB - Stafford!M22:M24). Vertical key GAME_DATE from
    column B; horizontal key INDICATOR Fantasy Score from M3.
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: stafford_reg_season_totals
  sheet: QB - Stafford
  data_range: QB - Stafford!E25:QB - Stafford!M25
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_stafford_reg_season_totals
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: TOTAL_PHASE
      role: key
      scope: series
      bind:
        kind: row_label
        label_column: A
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Regular Season
  sdmx_notes: >-
    Regular-season cumulative totals row (QB - Stafford!E25:M25). Vertical key
    TOTAL_PHASE from A25; horizontal key INDICATOR from row 3.
  notes: Matrix fixture — vertical=totals phase label (column A), horizontal=statistic (row 3).
- id: stafford_playoff_totals
  sheet: QB - Stafford
  data_range: QB - Stafford!E27:QB - Stafford!M27
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_stafford_playoff_totals
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: TOTAL_PHASE
      role: key
      scope: series
      bind:
        kind: row_label
        label_column: A
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - INDICATOR
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    PHASE: Playoffs
  sdmx_notes: >-
    Playoff cumulative totals row (QB - Stafford!E27:M27). Vertical key TOTAL_PHASE from
    A27; horizontal key INDICATOR from row 3.
  notes: Matrix fixture — vertical=totals phase label (column A), horizontal=statistic (row 3).
