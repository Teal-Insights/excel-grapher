schema_version: 1.4.0
workbook: ffv3_large.xlsx
concept_scheme:
  id: la_rams_2025
  concepts:
  - id: TIME_PERIOD
    dtype: string
    description: Game week label (W1-W18, PO1-PO3) or SEASON for summaries.
  - id: TOTAL_PHASE
    dtype: string
    description: REG SEASON TOTALS or PLAYOFF TOTALS.
series:
- id: agg_fantasy_stafford_w1
  sheet: Aggregate Stats
  data_range: Aggregate Stats!C4:Aggregate Stats!C4
  layout: scalar
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: TIME_PERIOD
      role: key
      scope: series
      bind:
        kind: constant
        value: W1
    attributes:
    - concept: UNIT_MEASURE
      role: attribute
      value: POINTS
      include_in_record: true
  key:
  - TIME_PERIOD
  series_context:
    PLAYER: M. Stafford
    POSITION: QB
    INDICATOR: Fantasy Score
  sdmx_notes: M. Stafford fantasy score for W1 on Aggregate Stats.
  output:
    compute:
      name: compute_agg_fantasy_stafford_w1
