schema_version: 1.4.0
workbook: ffv3_large.xlsx
concept_scheme:
  id: player_game_log
  concepts:
  - id: GAME_WEEK
    dtype: string
    description: Game week label (W1-W18, PO1-PO3) from column A.
  - id: GAME_DATE
    dtype: string
    description: Game date text from column B (vertical matrix key).
  - id: INDICATOR
    dtype: string
    description: Stat column header from row 3 (horizontal matrix key).
  - id: TOTAL_PHASE
    dtype: string
    description: REG SEASON TOTALS or PLAYOFF TOTALS row label from column A.
series:
- id: k_williams_game_date
  sheet: RB - K.Williams
  data_range: RB - K.Williams!B4:RB - K.Williams!B24
  layout: series
  editable: true
  input:
    setter:
      name: set_k_williams_game_date
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: GAME_WEEK
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - GAME_WEEK
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    INDICATOR: Date
  sdmx_notes: Game date input column (RB - K.Williams!B4:B24), keyed by week label in column A.
- id: k_williams_game_result
  sheet: RB - K.Williams
  data_range: RB - K.Williams!D4:RB - K.Williams!D24
  layout: series
  editable: true
  input:
    setter:
      name: set_k_williams_game_result
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: GAME_WEEK
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - GAME_WEEK
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    INDICATOR: Result
  sdmx_notes: Win/loss result input column (RB - K.Williams!D4:D24), keyed by week label in column A.
- id: k_williams_reg_season_stats
  sheet: RB - K.Williams
  data_range: RB - K.Williams!E4:RB - K.Williams!G20
  layout: matrix
  editable: true
  input:
    setter:
      name: set_k_williams_reg_season_stats
  structure:
    measure: &id001
      concept: OBS_VALUE
      dtype: int
      bind:
        kind: data_cell
        read: int
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    PHASE: Regular Season
  sdmx_notes: Regular-season stat matrix (RB - K.Williams!E4:G20).
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: k_williams_playoff_stats
  sheet: RB - K.Williams
  data_range: RB - K.Williams!E22:RB - K.Williams!G24
  layout: matrix
  editable: true
  input:
    setter:
      name: set_k_williams_playoff_stats
  structure:
    measure: *id001
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    PHASE: Playoffs
  sdmx_notes: Playoff stat matrix (RB - K.Williams!E22:G24).
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: k_williams_reg_fantasy_score
  sheet: RB - K.Williams
  data_range: RB - K.Williams!H4:RB - K.Williams!H20
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_k_williams_reg_fantasy_score
  structure:
    measure: &id002
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    INDICATOR: Fantasy Score
    PHASE: Regular Season
  sdmx_notes: Regular-season fantasy score (RB - K.Williams!H4:H20).
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: k_williams_playoff_fantasy_score
  sheet: RB - K.Williams
  data_range: RB - K.Williams!H22:RB - K.Williams!H24
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_k_williams_playoff_fantasy_score
  structure:
    measure: *id002
    dimensions:
    - concept: GAME_DATE
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: B
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - GAME_DATE
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    INDICATOR: Fantasy Score
    PHASE: Playoffs
  sdmx_notes: Playoff fantasy score (RB - K.Williams!H22:H24).
  notes: Matrix fixture — vertical=date (column B), horizontal=statistic (row 3).
- id: k_williams_reg_season_totals
  sheet: RB - K.Williams
  data_range: RB - K.Williams!E25:RB - K.Williams!H25
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_k_williams_reg_season_totals
  structure:
    measure: *id002
    dimensions:
    - concept: TOTAL_PHASE
      role: key
      scope: series
      bind:
        kind: row_label
        label_column: A
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    PHASE: Regular Season
  sdmx_notes: Regular-season totals row (RB - K.Williams!E25:H25). Touchdowns/Targets column E omitted (— placeholder).
  notes: Matrix fixture — vertical=totals phase label (column A), horizontal=statistic (row 3).
- id: k_williams_playoff_totals
  sheet: RB - K.Williams
  data_range: RB - K.Williams!E27:RB - K.Williams!H27
  layout: matrix
  editable: false
  output:
    compute:
      name: compute_k_williams_playoff_totals
  structure:
    measure: *id002
    dimensions:
    - concept: TOTAL_PHASE
      role: key
      scope: series
      bind:
        kind: row_label
        label_column: A
        read: string
    - concept: INDICATOR
      role: key
      scope: cell
      bind:
        kind: column_header
        header_row: 3
        read: string
  key:
  - INDICATOR
  series_context:
    PLAYER: K. Williams
    POSITION: RB
    PHASE: Playoffs
  sdmx_notes: Playoff totals row (RB - K.Williams!E27:H27). Touchdowns/Targets column E omitted (— placeholder).
  notes: Matrix fixture — vertical=totals phase label (column A), horizontal=statistic (row 3).
