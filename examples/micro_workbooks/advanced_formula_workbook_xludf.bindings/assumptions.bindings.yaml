schema_version: 1.4.0
workbook: advanced_formula_workbook_xludf.xlsx
concept_scheme:
  id: advanced_formula_workbook
  concepts:
  - id: PARAMETER
    dtype: string
    description: Assumption label from column A.
  - id: FISCAL_YEAR
    dtype: int
    description: Projection year from header row.
  - id: LINE_ITEM
    dtype: string
    description: Statement line item from column A.
  - id: METRIC
    dtype: string
    description: Summary metric label.
  - id: EMP_ID
    dtype: string
    description: Employee identifier from column A.
  - id: SKU
    dtype: string
    description: Product SKU from column A.
  - id: REP_ID
    dtype: string
    description: Sales rep identifier from column A.
  - id: QUARTER
    dtype: string
    description: Fiscal quarter from header row.
  - id: FIELD
    dtype: string
    description: Lookup or analytics field label.
  - id: PERIOD
    dtype: string
    description: Month label or period key.
  - id: MONTH
    dtype: string
    description: Calendar month label from column B.
  - id: YEAR
    dtype: int
    description: Calendar year from column C.
  - id: STATISTIC
    dtype: string
    description: Descriptive statistic label.
  - id: FUNCTION
    dtype: string
    description: Excel function name.
  - id: DEMO
    dtype: string
    description: Formula toolkit demo name.
series:
- id: company_profile_text
  sheet: Assumptions
  data_range: Assumptions!B5:Assumptions!B7
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Text company profile inputs (Assumptions!B5:B7).
  series_context:
    SECTION: Company Profile
  input:
    setter:
      name: set_company_profile_text
- id: company_profile_numeric
  sheet: Assumptions
  data_range: Assumptions!B8:Assumptions!B10
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Numeric company profile inputs (Assumptions!B8:B10).
  series_context:
    SECTION: Company Profile
  input:
    setter:
      name: set_company_profile_numeric
- id: financial_assumptions
  sheet: Assumptions
  data_range: Assumptions!B14:Assumptions!B23
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Financial assumption rates (Assumptions!B14:B23).
  series_context:
    SECTION: Financial Assumptions
  input:
    setter:
      name: set_financial_assumptions
- id: scenario_assumptions
  sheet: Assumptions
  data_range: Assumptions!B27:Assumptions!B30
  layout: series
  editable: true
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Scenario selector and growth rates (Assumptions!B27:B30).
  series_context:
    SECTION: Scenario Selector
  input:
    setter:
      name: set_scenario_assumptions
- id: active_growth_rate
  sheet: Assumptions
  data_range: Assumptions!B31:Assumptions!B31
  layout: scalar
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: float
      bind:
        kind: data_cell
        read: float
    dimensions:
    - concept: PARAMETER
      role: key
      scope: series
      bind:
        kind: constant
        value: Active Growth Rate
  key:
  - PARAMETER
  sdmx_notes: CHOOSE-driven active growth rate (Assumptions!B31).
  series_context:
    SECTION: Scenario Selector
  output:
    compute:
      name: compute_active_growth_rate
- id: assumption_validation
  sheet: Assumptions
  data_range: Assumptions!B35:Assumptions!B40
  layout: series
  editable: false
  structure:
    measure:
      concept: OBS_VALUE
      dtype: string
      bind:
        kind: data_cell
        read: string
    dimensions:
    - concept: PARAMETER
      role: key
      scope: cell
      bind:
        kind: row_label
        label_column: A
        read: string
  key:
  - PARAMETER
  sdmx_notes: Validation status cells (Assumptions!B35:B40).
  series_context:
    SECTION: Assumption Validation
  output:
    compute:
      name: compute_assumption_validation
