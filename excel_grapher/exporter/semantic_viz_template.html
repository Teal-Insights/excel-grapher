<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #e8eaed; color: #24292f; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 8px 12px; background: #f0f2f5; border-bottom: 1px solid #d0d7de;
      font-size: 13px;
    }
    #toolbar label { display: flex; gap: 4px; align-items: center; user-select: none; }
    #wrap { position: relative; width: 100%; height: calc(100% - 48px); background: #fff; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; background: #fff; }
    canvas.dragging { cursor: grabbing; }
    #tip {
      position: fixed; z-index: 20; pointer-events: none; display: none;
      max-width: 360px; padding: 8px 10px; background: #fff; border: 1px solid #d0d7de;
      border-radius: 8px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 24px rgba(0,0,0,.12);
    }
    #stats { margin-left: auto; opacity: 0.8; font-size: 12px; }
    #banner { color: #9a6700; font-weight: 600; }
    #search { min-width: 160px; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 6px; }
    button { font: inherit; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong id="docTitle">__TITLE__</strong>
    <label><input type="checkbox" data-dir="constant" checked /> Constants</label>
    <label><input type="checkbox" data-dir="input" checked /> Inputs</label>
    <label><input type="checkbox" data-dir="internal" checked /> Internals</label>
    <label><input type="checkbox" data-dir="output" checked /> Outputs</label>
    <input id="search" type="search" placeholder="Highlight series…" />
    <button id="fit" type="button">Fit</button>
    <span id="banner"></span>
    <span id="stats"></span>
  </div>
  <div id="wrap">
    <canvas id="raster"></canvas>
  </div>
  <div id="tip"></div>
  <script>
    /*__BOOTSTRAP__*/
    /*__SIDECAR__*/
  </script>
  <script>
(function () {
  'use strict';

  function seriesColor(seriesId, seriesIds) {
    var i = seriesIds.indexOf(seriesId);
    if (i < 0) i = 0;
    var h = (i * 47 + 13) % 360;
    return 'hsl(' + h + ', 62%, 78%)';
  }

  async function loadData() {
    if (window.__VIZ_DATA__) return window.__VIZ_DATA__;
    var url = window.__VIZ_DATA_URL__;
    if (!url) throw new Error('No visualization data');
    var r = await fetch(url);
    if (!r.ok) throw new Error('Failed to load ' + url);
    return r.json();
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];
    });
  }

  var MARKER_COLORS = {
    identity: '#0969da',
    shift: '#8250df',
    affine: '#1a7f37',
    gather: '#9a6700',
    whole: '#9a6700',
    dynamic: '#9a6700',
    cross_partition: '#9a6700'
  };

  function nodeLabel(n) {
    if (n.is_remainder) return 'unbound (' + n.cell_count + ')';
    if (n.id !== n.series_id) return n.series_id + ' [' + n.start + ':' + n.stop + ']';
    return n.series_id;
  }

  function boxPoint(fromX, fromY, node) {
    var dx = node._x - fromX;
    var dy = node._y - fromY;
    if (dx === 0 && dy === 0) return {x: node._x, y: node._y};
    var hw = node._w / 2 + 4;
    var hh = node._h / 2 + 4;
    var t = Math.min(hw / Math.abs(dx), hh / Math.abs(dy));
    return {x: node._x - dx * t, y: node._y - dy * t};
  }

  var DIR_ORDER = {output: 0, internal: 1, input: 2, constant: 3, remainder: 4};

  function dirRank(n) {
    if (n.is_remainder) return 4;
    return DIR_ORDER[n.direction] == null ? 1 : DIR_ORDER[n.direction];
  }

  var CAMERA_MAX_W = 2800;
  var BOX_MAX_PRIMITIVES = __BOX_MAX_PRIMITIVES__;

  function spreadRank(widths, pad, minGap, minRowWidth, graphWidth) {
    var n = widths.length;
    if (!n) return [];
    var innerNodes = 0;
    widths.forEach(function (w) { innerNodes += w; });
    var packedInner = n > 1 ? innerNodes + minGap * (n - 1) : innerNodes;
    var packedWidth = pad + packedInner + pad;
    var target = Math.max(packedWidth, Math.min(minRowWidth, graphWidth));
    var inner = target - 2 * pad;
    if (n === 1) return [pad + inner / 2];
    var gap = (inner - innerNodes) / (n - 1);
    if (gap < minGap) gap = minGap;
    var x = pad;
    var centers = [];
    widths.forEach(function (w) {
      centers.push(x + w / 2);
      x += w + gap;
    });
    return centers;
  }

  function layoutByRank(nodes, compact) {
    var pad = compact ? 24 : 48;
    var rankGap = compact ? 16 : 72;
    var nodeGap = compact ? 4 : 16;
    var byRank = {};
    nodes.forEach(function (n) {
      if (n._hidden) return;
      var rank = n.rank || 0;
      (byRank[rank] || (byRank[rank] = [])).push(n);
    });
    var ranks = Object.keys(byRank).map(Number).sort(function (a, b) { return a - b; });
    ranks.forEach(function (rank) {
      var rowNodes = byRank[rank];
      rowNodes.sort(function (a, b) {
        var da = dirRank(a) - dirRank(b);
        if (da !== 0) return da;
        if (a.series_id < b.series_id) return -1;
        if (a.series_id > b.series_id) return 1;
        return a.start - b.start;
      });
      rowNodes.forEach(function (n) {
        n._w = compact ? 6 : Math.max(72, n._label.length * 7 + 16);
        n._h = compact ? 6 : 28;
      });
    });
    var packedW = 0;
    ranks.forEach(function (rank) {
      var rowNodes = byRank[rank];
      var inner = 0;
      rowNodes.forEach(function (n) { inner += n._w; });
      if (rowNodes.length > 1) inner += nodeGap * (rowNodes.length - 1);
      packedW = Math.max(packedW, pad + inner + pad);
    });
    var maxW = Math.max(920, packedW);
    ranks.forEach(function (rank, row) {
      var rowNodes = byRank[rank];
      var y = pad + row * rankGap;
      var centers = spreadRank(
        rowNodes.map(function (n) { return n._w; }),
        pad, nodeGap, CAMERA_MAX_W, packedW || maxW
      );
      rowNodes.forEach(function (n, i) {
        n._x = centers[i];
        n._y = y;
      });
    });
    var height = Math.max(640, pad + Math.max(ranks.length, 1) * rankGap + pad);
    return {width: maxW, height: height};
  }

  function cameraFor(size) {
    return {
      x: 0,
      y: 0,
      w: Math.min(size.width, CAMERA_MAX_W),
      h: size.height
    };
  }

  loadData().then(function (data) {
    var stats = data.stats || {};
    document.getElementById('stats').textContent =
      (stats.statement_count || 0) + ' statements · ' +
      (stats.bundle_count || 0) + ' bundles · ' +
      (stats.instance_edge_count || 0) + ' instance edges · ' +
      (stats.cell_count || 0) + ' bound cells';
    if ((data.heterogeneous_pairs || []).length) {
      document.getElementById('banner').textContent =
        'Heterogeneous partitions: ' + data.heterogeneous_pairs.map(function (p) { return p.join(' ⇄ '); }).join(', ');
    }

    var raster = document.getElementById('raster');
    var nodes = data.nodes || [];
    var bundles = data.bundles || [];
    var seriesIds = [];
    nodes.forEach(function (n) {
      if (seriesIds.indexOf(n.series_id) < 0) seriesIds.push(n.series_id);
      n._label = nodeLabel(n);
    });
    var markStyle = (nodes.length + 2 * bundles.length) > BOX_MAX_PRIMITIVES ? 'dots' : 'boxes';
    if (markStyle === 'dots' && !document.getElementById('banner').textContent) {
      document.getElementById('banner').textContent = 'Dots view (large graph)';
    }
    var constantCount = nodes.filter(function (n) { return n.direction === 'constant'; }).length;
    if (constantCount >= 24) {
      var constBox = document.querySelector('#toolbar input[data-dir="constant"]');
      if (constBox) constBox.checked = false;
    }

    var vb = {x: 0, y: 0, w: 920, h: 640};
    var byId = {};

    function enabledDirs() {
      var dirs = {};
      document.querySelectorAll('#toolbar input[data-dir]').forEach(function (el) {
        dirs[el.getAttribute('data-dir')] = el.checked;
      });
      return dirs;
    }

    function query() {
      return (document.getElementById('search').value || '').trim().toLowerCase();
    }

    function nodeTip(n) {
      return [
        n.id,
        'series ' + n.series_id + '  direction ' + n.direction,
        'rank ' + n.rank + '  cells ' + n.cell_count,
        (n.cells || []).slice(0, 8).join(', ')
      ].join('\n');
    }

    function inView(x0, y0, x1, y1) {
      return x1 >= vb.x && x0 <= vb.x + vb.w && y1 >= vb.y && y0 <= vb.y + vb.h;
    }

    function endpointInView(n, margin) {
      return n._x >= vb.x - margin && n._x <= vb.x + vb.w + margin &&
        n._y >= vb.y - margin && n._y <= vb.y + vb.h + margin;
    }

    function beginFrame() {
      var wrap = document.getElementById('wrap');
      var cssW = Math.max(wrap.clientWidth || window.innerWidth || 1600, 320);
      var cssH = Math.max(wrap.clientHeight || (window.innerHeight - 48) || 640, 200);
      raster.style.width = cssW + 'px';
      raster.style.height = cssH + 'px';
      var dpr = window.devicePixelRatio || 1;
      raster.width = Math.floor(cssW * dpr);
      raster.height = Math.floor(cssH * dpr);
      var ctx = raster.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, cssW, cssH);
      var sx = cssW / vb.w;
      var sy = cssH / vb.h;
      ctx.save();
      ctx.translate(-vb.x * sx, -vb.y * sy);
      ctx.scale(sx, sy);
      return {ctx: ctx, cssW: cssW};
    }

    function paintBoxes() {
      var frame = beginFrame();
      var ctx = frame.ctx;
      var q = query();
      var zoomedOut = vb.w > 1400;
      bundles.forEach(function (b) {
        var a = byId[b.consumer_id];
        var c = byId[b.producer_id];
        if (!a || !c || a._hidden || c._hidden) return;
        if (!endpointInView(a, 80) && !endpointInView(c, 80)) return;
        var color = MARKER_COLORS[b.discharged ? 'shift' : (b.access || 'identity')] || MARKER_COLORS.identity;
        ctx.globalAlpha = (b.guarded ? 0.55 : 1) * (q && (!a._match || !c._match) ? 0.18 : 1);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.setLineDash((b.discharged || b.access === 'shift') ? [6, 4] : []);
        ctx.beginPath();
        if (a === c) {
          var r = Math.max(a._w, 56) * 0.45;
          ctx.moveTo(a._x + 12, a._y - a._h / 2);
          ctx.bezierCurveTo(a._x + r, a._y - r - 18, a._x - r, a._y - r - 18, a._x - 12, a._y - a._h / 2);
          ctx.stroke();
        } else {
          var start = boxPoint(c._x, c._y, a);
          var end = boxPoint(a._x, a._y, c);
          var dx = end.x - start.x;
          var bend = (b.discharged ? 36 : 0) * (dx >= 0 ? 1 : -1);
          var cx = (start.x + end.x) / 2 + bend;
          var cy = (start.y + end.y) / 2;
          ctx.moveTo(start.x, start.y);
          ctx.quadraticCurveTo(cx, cy, end.x, end.y);
          ctx.stroke();
          if (!zoomedOut) {
            ctx.setLineDash([]);
            var tx = end.x - cx;
            var ty = end.y - cy;
            var len = Math.sqrt(tx * tx + ty * ty) || 1;
            tx /= len;
            ty /= len;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(end.x, end.y);
            ctx.lineTo(end.x - 12 * tx + 5 * ty, end.y - 12 * ty - 5 * tx);
            ctx.lineTo(end.x - 12 * tx - 5 * ty, end.y - 12 * ty + 5 * tx);
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      });
      var showLabels = 12 * (frame.cssW / Math.max(vb.w, 1)) >= 7;
      nodes.forEach(function (n) {
        if (n._hidden) return;
        var x0 = n._x - n._w / 2;
        var y0 = n._y - n._h / 2;
        if (!inView(x0, y0, x0 + n._w, y0 + n._h)) return;
        ctx.save();
        if (q && !n._match) ctx.globalAlpha *= 0.18;
        ctx.fillStyle = n.is_remainder ? '#d0d7de' : seriesColor(n.series_id, seriesIds);
        ctx.strokeStyle = '#1f2328';
        ctx.lineWidth = (q && n._match) ? 2.4 : 1.2;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x0, y0, n._w, n._h, 6);
        else ctx.rect(x0, y0, n._w, n._h);
        ctx.fill();
        ctx.stroke();
        if (showLabels) {
          ctx.fillStyle = '#1f2328';
          ctx.font = '12px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(n._label, n._x, n._y);
        }
        ctx.restore();
      });
      ctx.restore();
    }

    function paintDots() {
      var frame = beginFrame();
      var ctx = frame.ctx;
      var q = query();
      var edgeCap = 8000;
      var painted = 0;
      ctx.lineWidth = 0.7;
      ctx.lineCap = 'round';
      bundles.forEach(function (b) {
        if (painted >= edgeCap) return;
        var a = byId[b.consumer_id];
        var c = byId[b.producer_id];
        if (!a || !c || a._hidden || c._hidden) return;
        if (!endpointInView(a, 24) && !endpointInView(c, 24)) return;
        painted += 1;
        ctx.globalAlpha = (b.guarded ? 0.22 : 0.35) * (q && (!a._match || !c._match) ? 0.12 : 1);
        ctx.strokeStyle = MARKER_COLORS[b.discharged ? 'shift' : (b.access || 'identity')] || MARKER_COLORS.identity;
        ctx.beginPath();
        ctx.moveTo(c._x, c._y);
        ctx.lineTo(a._x, a._y);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      nodes.forEach(function (n) {
        if (n._hidden) return;
        if (!inView(n._x - 4, n._y - 4, n._x + 4, n._y + 4)) return;
        ctx.globalAlpha = (q && !n._match) ? 0.18 : 0.95;
        ctx.fillStyle = n.is_remainder ? '#8c959f' : seriesColor(n.series_id, seriesIds);
        ctx.beginPath();
        ctx.arc(n._x, n._y, q && n._match ? 3.4 : 2.4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function paintCanvas() {
      try {
        if (markStyle === 'dots') paintDots();
        else paintBoxes();
      } catch (err) {
        document.getElementById('stats').textContent = String(err);
      }
    }

    function draw(resetView) {
      var dirs = enabledDirs();
      var q = query();
      nodes.forEach(function (n) {
        var dir = n.is_remainder ? 'internal' : (n.direction || 'internal');
        n._hidden = dirs[dir] === false;
        n._match = !q || String(n.series_id).toLowerCase().indexOf(q) >= 0 || String(n.id).toLowerCase().indexOf(q) >= 0;
      });
      var size = layoutByRank(nodes, markStyle === 'dots');
      if (resetView !== false) vb = cameraFor(size);
      byId = {};
      nodes.forEach(function (n) { byId[n.id] = n; });
      paintCanvas();
    }

    draw();

    document.querySelectorAll('#toolbar input[data-dir]').forEach(function (el) {
      el.addEventListener('change', function () { draw(true); });
    });
    document.getElementById('search').addEventListener('input', function () { draw(false); });
    document.getElementById('fit').addEventListener('click', function () { draw(true); });

    var dragging = false;
    var last = null;
    raster.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      dragging = true;
      last = {x: ev.clientX, y: ev.clientY};
      raster.classList.add('dragging');
      raster.setPointerCapture(ev.pointerId);
    });
    raster.addEventListener('pointerup', function () {
      dragging = false;
      last = null;
      raster.classList.remove('dragging');
    });
    raster.addEventListener('pointermove', function (ev) {
      if (!dragging || !last) return;
      var rect = raster.getBoundingClientRect();
      var dx = (ev.clientX - last.x) * (vb.w / rect.width);
      var dy = (ev.clientY - last.y) * (vb.h / rect.height);
      vb.x -= dx;
      vb.y -= dy;
      last = {x: ev.clientX, y: ev.clientY};
      paintCanvas();
    });
    raster.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var rect = raster.getBoundingClientRect();
      var mx = vb.x + (ev.clientX - rect.left) * (vb.w / rect.width);
      var my = vb.y + (ev.clientY - rect.top) * (vb.h / rect.height);
      var factor = ev.deltaY < 0 ? 0.9 : 1.1;
      vb.w *= factor;
      vb.h *= factor;
      vb.x = mx - (ev.clientX - rect.left) * (vb.w / rect.width);
      vb.y = my - (ev.clientY - rect.top) * (vb.h / rect.height);
      paintCanvas();
    }, {passive: false});

    var tip = document.getElementById('tip');
    raster.addEventListener('mousemove', function (ev) {
      if (dragging) return;
      var rect = raster.getBoundingClientRect();
      var wx = vb.x + (ev.clientX - rect.left) * (vb.w / rect.width);
      var wy = vb.y + (ev.clientY - rect.top) * (vb.h / rect.height);
      var hit = null;
      var hitR = markStyle === 'dots' ? 6 : null;
      for (var i = nodes.length - 1; i >= 0; i--) {
        var n = nodes[i];
        if (n._hidden) continue;
        var rx = hitR != null ? hitR : n._w / 2;
        var ry = hitR != null ? hitR : n._h / 2;
        if (Math.abs(wx - n._x) <= rx && Math.abs(wy - n._y) <= ry) {
          hit = nodeTip(n);
          break;
        }
      }
      if (!hit) { tip.style.display = 'none'; return; }
      tip.style.display = 'block';
      tip.style.left = (ev.clientX + 12) + 'px';
      tip.style.top = (ev.clientY + 12) + 'px';
      tip.innerHTML = esc(hit).replace(/\n/g, '<br/>');
    });
    window.addEventListener('resize', function () { paintCanvas(); });
  }).catch(function (err) {
    document.getElementById('stats').textContent = String(err);
  });
})();
  </script>
</body>
</html>
